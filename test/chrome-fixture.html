<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>顶栏分段控件 · 夹具</title>
<!--
  复刻宿主标题行的真实结构（源码实证，`_recon/ex4/.../dsh-client-ui-conversation/lib/client.js`）：

    <div class="hdr">                                   header（grid，min-height:76px）
      <div class="tabs">                                .tabs{display:flex;gap:16px 20px;width:100%;padding-left:8px}
        <div class="viewTabs" role="tablist" data-conversation-tabs>
          <button class="tab" role="tab" aria-selected>…</button>   ← 直接子节点，没有包装层
        </div>
        <button class="viewsMore">…</button>              「更多视图」按钮（兄弟节点）
      </div>
    </div>

  关键：**按钮是 tablist 的直接子节点**（v0.9.0 重写时按源码与现场 diag 双重确认）。
  旧夹具多套了一层 <span class="hc">，那是把问题归因错了地方，已删除。

  两条断言路径：
    1) 宽 520px：装得下 → 应当画成分段控件（按钮 26px 高、12px 内边距、轨道带底色）
    2) 压到 200px：装不下 → 应当整条退回宿主原样（不留内联样式、不加 data-ahig-tabs）
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #121212; color: #f9fafb; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .frame { width: 520px; border-bottom: .5px solid rgba(255,255,255,.12); }
  .hdr {
    box-sizing: border-box;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    min-height: 76px;
    padding: 10px 28px 0 20px;
  }
  .tabs { display: flex; flex-wrap: wrap; grid-column: 1/-1; gap: 16px 20px; margin-top: 10px; padding-left: 8px; width: 100%; }
  .viewTabs { display: flex; flex-wrap: wrap; gap: 32px; min-width: 0; min-height: 25px; }
  .tab {
    position: relative;
    min-height: 25px;
    padding: 0 0 9px;
    border: none;
    background: none;
    color: #adb2b8;
    font-size: 13px;
    font-weight: 500;
    line-height: 16px;
    cursor: pointer;
  }
  .tab:after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    border-radius: 2px;
    background: none;
  }
  .tabActive { color: #60a5fa; }
  .tabActive:after { background: #60a5fa; }
  .viewsMore { width: 22px; height: 22px; margin-top: -3px; border: none; background: none; color: #adb2b8; }
  #out { font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; padding: 8px 12px; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="hdr">
    <div class="tabs" id="tabsRow">
      <div class="viewTabs" role="tablist" data-conversation-tabs id="list">
        <button type="button" role="tab" class="tab tabActive" aria-selected="true">对话</button>
        <button type="button" role="tab" class="tab" aria-selected="false">轨迹</button>
        <button type="button" role="tab" class="tab" aria-selected="false">上下文</button>
        <button type="button" role="tab" class="tab" aria-selected="false">上下文</button>
        <button type="button" role="tab" class="tab" aria-selected="false">编队</button>
      </div>
      <button type="button" class="viewsMore" id="more" aria-label="更多视图">…</button>
    </div>
  </div>
</div>
<pre id="out"></pre>

<script>
  const out = document.getElementById('out');
  const lines = [];
  let failed = 0;
  function ok(cond, name, detail) {
    const line = (cond ? 'PASS ' : 'FAIL ') + name + (detail === undefined ? '' : ' — ' + detail);
    lines.push('  ' + line);
    if (!cond) failed += 1;
  }
  function report() {
    out.textContent = lines.join('\n') + '\n\n' + (failed ? '有 ' + failed + ' 项失败' : '全部通过');
    document.title = failed ? 'FAIL' : 'ALL PASS';
  }

  window.__ModuleLoader__ = { load: (def) => { window.__def = def } };
</script>
<script src="../lib/client.js"></script>
<script>
  const ReactStub = { createElement: () => null, Component: class { constructor(p) { this.props = p } setState() {} } }
  const slots = {
    register: () => () => {},
    inject: (_name, factory) => { for (const _ of factory()) {} },
  }
  const theme = {
    getTheme: () => ({ active: 'dark', preference: 'dark', fontSizes: {}, fontFamilies: {}, themes: [], revision: 1 }),
    setTheme: () => {},
    setFontSize: () => {},
    register: () => () => {},
    overrideTokens: () => () => {},
  }
  const mod = window.__def.factory((id) => (id === 'react' ? ReactStub : {}))
  mod.apply({ slots, theme, effect: (fn) => fn() })

  const list = document.getElementById('list')
  const btns = () => Array.from(list.querySelectorAll('button[role="tab"]'))
  const px = (v) => Math.round(parseFloat(v) || 0)
  const api = window.dshAppleHig

  // ---- 1) 宽容器：应当画成分段控件 ----
  const wide = api.tabs()
  ok(wide.buttons === 5, '五个标签都被识别（直接子节点）', String(wide.buttons))
  ok(wide.on === true, '宽容器下画成分段控件', String(wide.on))
  ok(list.getAttribute('data-ahig-tabs') === '1', '轨道打上 data-ahig-tabs')
  const heights = btns().map((b) => px(getComputedStyle(b).height))
  ok(heights.every((h) => h === 26), '每个标签 26px 高', heights.join('/'))
  const pads = btns().map((b) => px(getComputedStyle(b).paddingLeft))
  ok(pads.every((p) => p === 12), '按钮拿到 12px 内边距', pads.join('/'))
  const lefts = btns().map((b) => Math.round(b.getBoundingClientRect().left))
  const rights = btns().map((b) => Math.round(b.getBoundingClientRect().right))
  let maxOverlap = 0
  for (let i = 1; i < lefts.length; i += 1) maxOverlap = Math.max(maxOverlap, rights[i - 1] - lefts[i])
  ok(maxOverlap <= 0, '相邻标签不重叠', 'maxOverlap=' + maxOverlap + 'px')
  const trackBox = list.getBoundingClientRect()
  const lastRight = rights[rights.length - 1]
  ok(trackBox.right >= lastRight - 1, '轨道包住最后一个标签', Math.round(trackBox.right) + ' vs ' + lastRight)
  const more = document.getElementById('more').getBoundingClientRect()
  ok(more.left >= trackBox.right - 2, '「更多」按钮不被轨道压住', Math.round(more.left) + ' vs ' + Math.round(trackBox.right))

  // ---- 2) 压到 200px：应当整条退回宿主原样 ----
  document.getElementById('tabsRow').style.width = '200px'
  const narrow = api.tabs()
  ok(narrow.on === false, '装不下时不做改造（退回宿主下划线样式）', String(narrow.on))
  const narrowPad = px(getComputedStyle(btns()[0]).paddingLeft)
  ok(narrowPad === 0, '退回后没有残留内联内边距', String(narrowPad))
  const trackRight = list.getBoundingClientRect().right
  const rowRight = document.getElementById('tabsRow').getBoundingClientRect().right
  ok(trackRight <= rowRight + 1, '退回后轨道不溢出所在行', Math.round(trackRight) + ' vs ' + Math.round(rowRight))

  // ---- 3) 恢复宽度：重新画上 ----
  document.getElementById('tabsRow').style.width = '100%'
  const again = api.tabs()
  ok(again.on === true, '恢复宽度后重新画上', String(again.on))

  report()
</script>
</body>
</html>
