<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>顶栏分段控件 · 夹具</title>
<!--
  复刻宿主标题行的真实结构（源码实证，`_recon/ex4/.../dsh-client-ui-conversation/lib/client.js`）：

    <div class="hdr">                                   header（grid，min-height:76px）
      <div class="tabs">                                .tabs{display:flex;gap:16px 20px;width:100%;padding-left:8px}
        <div class="viewTabs" role="tablist" data-conversation-tabs>
          <button class="tab" role="tab" aria-selected>…</button>   ← 直接子节点，没有包装层
        </div>
        <button class="viewsMore">…</button>              「更多视图」按钮（兄弟节点）
      </div>
    </div>

  关键：**按钮是 tablist 的直接子节点**（v0.9.0 重写时按源码与现场 diag 双重确认）。
  旧夹具多套了一层 <span class="hc">，那是把问题归因错了地方，已删除。

  两条断言路径：
    1) 宽 520px：装得下 → 应当画成分段控件（按钮 34px 高、12px 内边距、轨道带底色）
    2) 压到 200px：装不下 → 应当整条退回宿主原样（不留内联样式、不加 data-ahig-tabs）
-->
<style>
  :root { color-scheme: dark; }
  /* 宿主主题令牌的最小副本：夹具没有 theme 服务，变量缺了 var() 会整条失效 */
  :root {
    --dsw-alias-label-primary: #f9fafb;
    --dsw-alias-label-secondary: #cfd3d6;
    --dsw-alias-bg-base: #151517;
    --dsw-alias-border-l1: #ffffff0f;
    --dsw-alias-border-l2: #ffffff1f;
    --dsw-alias-border-l3: #ffffff29;
    /* 宿主深色主题的真实取值：layer-3 与 module-platform 同为 bluish-800 #353638。
       旧夹具把它们写成 #353638 / #2c2c2e，凭空造出了对比，于是"选中块浮起"这条
       断言在夹具里恒过、在真机上恒错。 */
    --dsw-alias-bg-layer-3: #353638;
    --dsw-alias-bg-module-platform: #353638;
    --dsw-alias-interactive-bg-hover: #ffffff14;
    --dsw-radius-sm: 9px;
    --dsw-radius-md: 13px;
  }
  body { margin: 0; background: #121212; color: #f9fafb; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .frame { width: 520px; }
  /* 分隔线在 header 自己身上（宿主 .an3WzG_header{border-bottom:.5px solid --dsw-alias-border-l3}）。
     旧夹具把它挂在 .frame 上，于是「轨道下沿离分隔线多远」根本没人管——
     真机上轨道紧贴分隔线（间隙 0）就是这么漏掉的。 */
  .hdr {
    box-sizing: border-box;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    min-height: 76px;
    padding: 10px 28px 0 20px;
    border-bottom: .5px solid var(--dsw-alias-border-l3);
  }
  .tabs { display: flex; flex-wrap: wrap; grid-column: 1/-1; gap: 16px 20px; margin-top: 10px; padding-left: 8px; width: 100%; }
  .viewTabs { display: flex; flex-wrap: wrap; gap: 32px; min-width: 0; min-height: 25px; }
  /* 逐字抄自宿主 dsh-client-ui-conversation 的 CSS module（.an3WzG_tab）：
     min-height:35px、margin:-10px -10px 0（左右各外扩 10px 的命中区）、padding:10px 10px 9px。
     这组负边距是真机上「轨道 188 宽、32 高、标签挤在一起」的唯一来源——
     旧夹具把它简化成 min-height:25px / padding:0 0 9px，于是夹具全过而真机照坏。 */
  .tab {
    --dsh-tab-hit-inline: 10px;
    position: relative;
    box-sizing: border-box;
    min-height: 35px;
    margin: -10px calc(-1 * var(--dsh-tab-hit-inline)) 0;
    padding: 10px var(--dsh-tab-hit-inline) 9px;
    border: none;
    background: none;
    color: #adb2b8;
    font-size: 13px;
    font-weight: 500;
    line-height: 16px;
    cursor: pointer;
  }
  .tab:after {
    content: "";
    position: absolute;
    left: var(--dsh-tab-hit-inline); right: var(--dsh-tab-hit-inline); bottom: -1px;
    height: 2px;
    border-radius: 2px;
    background: none;
  }
  .an3WzG_tabLabel { display: block; max-width: 88px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabActive { color: #60a5fa; }
  .tabActive:after { background: #60a5fa; }
  .viewsMore { width: 22px; height: 22px; margin-top: -3px; border: none; background: none; color: #adb2b8; }
  #out { font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; padding: 8px 12px; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="hdr">
    <div class="tabs" id="tabsRow">
      <div class="viewTabs" role="tablist" data-conversation-tabs id="list">
        <button type="button" role="tab" class="tab tabActive" aria-selected="true"><span class="an3WzG_tabLabel">对话</span></button>
        <button type="button" role="tab" class="tab" aria-selected="false"><span class="an3WzG_tabLabel">轨迹</span></button>
        <button type="button" role="tab" class="tab" aria-selected="false"><span class="an3WzG_tabLabel">上下文</span></button>
        <button type="button" role="tab" class="tab" aria-selected="false"><span class="an3WzG_tabLabel">上下文</span></button>
        <button type="button" role="tab" class="tab" aria-selected="false"><span class="an3WzG_tabLabel">编队</span></button>
      </div>
      <button type="button" class="viewsMore" id="more" aria-label="更多视图">…</button>
    </div>
  </div>
</div>
<pre id="out"></pre>

<script>
  const out = document.getElementById('out');
  // 模拟宿主：点击改变 aria-selected（真实应用里由 React 状态驱动）
  document.querySelectorAll('#list [role="tab"]').forEach((b) => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#list [role="tab"]').forEach((x) => x.setAttribute('aria-selected', String(x === b)))
    })
  })
  const lines = [];
  let failed = 0;
  function ok(cond, name, detail) {
    const line = (cond ? 'PASS ' : 'FAIL ') + name + (detail === undefined ? '' : ' — ' + detail);
    lines.push('  ' + line);
    if (!cond) failed += 1;
  }
  function report() {
    out.textContent = lines.join('\n') + '\n\n' + (failed ? '有 ' + failed + ' 项失败' : '全部通过');
    document.title = failed ? 'FAIL' : 'ALL PASS';
  }

  window.__ModuleLoader__ = { load: (def) => { window.__def = def } };
</script>
<script src="../lib/client.js"></script>
<script>
  const ReactStub = { createElement: () => null, Component: class { constructor(p) { this.props = p } setState() {} } }
  const slots = {
    register: () => () => {},
    inject: (_name, factory) => { for (const _ of factory()) {} },
  }
  // theme 桩：overrideTokens 真的把 token 落到 :root，这样夹具覆盖到「token 层 → CSS 变量」
  // 这段真实链路；否则插件声明的 --dsw-ahig-seg-pill 在夹具里永远拿不到，断言等于没测。
  const appliedTokens = {}
  const theme = {
    getTheme: () => ({ active: 'dark', preference: 'dark', fontSizes: {}, fontFamilies: {}, themes: [], revision: 1 }),
    setTheme: () => {},
    setFontSize: () => {},
    register: () => () => {},
    overrideTokens: (source, tokens) => {
      const prev = appliedTokens[source]
      appliedTokens[source] = tokens
      const paint = () => {
        for (const [name, pair] of Object.entries(tokens)) {
          document.documentElement.style.setProperty(name, pair.dark)
        }
      }
      paint()
      return () => {
        if (appliedTokens[source] !== tokens) return
        delete appliedTokens[source]
        const keep = new Set(Object.values(appliedTokens).flatMap((t) => Object.keys(t)))
        for (const name of Object.keys(tokens)) {
          if (!keep.has(name)) document.documentElement.style.removeProperty(name)
        }
        if (prev) for (const [name, pair] of Object.entries(prev)) document.documentElement.style.setProperty(name, pair.dark)
      }
    },
  }
  const mod = window.__def.factory((id) => (id === 'react' ? ReactStub : {}))
  mod.apply({ slots, theme, effect: (fn) => fn() })

  const list = document.getElementById('list')
  const btns = () => Array.from(list.querySelectorAll('button[role="tab"]'))
  const px = (v) => Math.round(parseFloat(v) || 0)
  const api = window.dshAppleHig

  // ---- 1) 宽容器：应当画成分段控件 ----
  // 先在「没人调用测试钩子」的状态下看：apply 里就该起好 pipeline 并画完。
  // 以前断言第一行自己调 api.tabs()（内部会 syncTabs），等于自证，真机没画也测不出来。
  ok(list.getAttribute('data-ahig-tabs') === '1', '启动期即已上色（不靠测试钩子触发）', String(list.getAttribute('data-ahig-tabs')))
  const wide = api.tabs()
  ok(wide.buttons === 5, '五个标签都被识别（直接子节点）', String(wide.buttons))
  ok(wide.on === true, '宽容器下画成分段控件', String(wide.on))
  ok(list.getAttribute('data-ahig-tabs') === '1', '轨道打上 data-ahig-tabs')
  const heights = btns().map((b) => px(getComputedStyle(b).height))
  ok(heights.every((h) => h === 34), '每个标签 34px 高（DSH SegmentedTabs md 档）', heights.join('/'))
  const pads = btns().map((b) => px(getComputedStyle(b).paddingLeft))
  ok(pads.every((p) => p === 12), '按钮拿到 12px 内边距（分段控件）', pads.join('/'))
  const lefts = btns().map((b) => Math.round(b.getBoundingClientRect().left))
  const rights = btns().map((b) => Math.round(b.getBoundingClientRect().right))
  let maxOverlap = 0
  for (let i = 1; i < lefts.length; i += 1) maxOverlap = Math.max(maxOverlap, rights[i - 1] - lefts[i])
  ok(maxOverlap <= 0, '相邻标签不重叠', 'maxOverlap=' + maxOverlap + 'px')
  // 未选中 400 / 选中 600：分段控件的「选中」靠字重差表达，两边都粗会整体偏重
  const weights = btns().map((b) => Number(getComputedStyle(b).fontWeight))
  ok(weights[0] === 600 && weights.slice(1).every((w) => w === 400), '字重：选中 600、未选 400', weights.join('/'))
  // 同名标签只在 title 里说明来源，不画角标数字（角标会顶到轨道上沿，与 mock 不符）
  const badge = getComputedStyle(btns()[2], '::after')
  ok(badge.display === 'none' || badge.content === 'none' || badge.content === '""', '同名标签不画角标数字', badge.display + ' ' + badge.content)
  // 轨道高 = 标签高 + 两侧 inset（mock 实测 42 = 34 + 4×2）
  ok(px(getComputedStyle(list).height) === 42, '轨道高 42px（34 + inset 4×2）', getComputedStyle(list).height)
  const segW0 = Math.round(btns()[0].getBoundingClientRect().width * 10) / 10
  ok(segW0 > 56 && segW0 < 59, '段宽＝自然宽等分（mock 实测 57.6，而非“最宽文字+24”的 66）', String(segW0))
  const widths = btns().map((b) => Math.round(b.getBoundingClientRect().width))
  ok(widths.every((w) => w === widths[0]), '分段等宽（HIG：segments 默认等宽）', widths.join('/'))
  ok(widths[0] <= 70, '分段宽度按真实文字量（不被 .tabLabel 的 max-width 撑到 88+24）', widths[0] + 'px')
  // 选中态由轨道上的 ::before 指示器表达（滑轨），不是选中按钮自带底色
  const trackBg = getComputedStyle(list).backgroundColor
  const ind = getComputedStyle(list, '::before')
  ok(ind.content !== 'none' && ind.position === 'absolute', '轨道上有滑动指示器（::before）', ind.content)
  ok(parseFloat(ind.width) > 0, '指示器宽度不为零', ind.width)
  // 控件与文字绑定：滑轨的目标位置/宽度必须来自选中按钮的实测矩形（不是按 n 等分的算术值）
  const railX = () => parseFloat(getComputedStyle(list).getPropertyValue('--ahig-seg-x')) || 0
  const railW = () => parseFloat(getComputedStyle(list).getPropertyValue('--ahig-seg-w')) || 0
  const inset0 = parseFloat(getComputedStyle(list).getPropertyValue('--ahig-seg-inset')) || 4
  ok(Math.abs(railX() - (btns()[0].getBoundingClientRect().left - list.getBoundingClientRect().left - inset0)) <= 1, '滑轨左缘贴住选中按钮', railX() + ' vs ' + (btns()[0].getBoundingClientRect().left - list.getBoundingClientRect().left - inset0))
  ok(Math.abs(railW() - btns()[0].getBoundingClientRect().width) <= 1, '滑轨宽度等于按钮宽度', railW() + ' vs ' + btns()[0].getBoundingClientRect().width)

  const listBox = list.getBoundingClientRect()
  const segW = Math.round(btns()[0].getBoundingClientRect().width)
  const sumSeg = btns().reduce((n, b) => n + b.getBoundingClientRect().width, 0)
  ok(Math.abs(listBox.width - (sumSeg + 8)) <= 2, '轨道宽 = 5 段 + 两侧 inset 4px', Math.round(listBox.width) + ' vs ' + Math.round(sumSeg) + '+8')
  ok(ind.backgroundColor !== trackBg, '指示器底色与轨道不同（选中块浮起）', ind.backgroundColor + ' vs ' + trackBg)
  ok(ind.transform === 'none' || ind.transform.indexOf('matrix') === 0, '初始指示器在第 1 段（无位移）', ind.transform)
  btns()[2].click()
  api.tabs()
  const idx = getComputedStyle(list).getPropertyValue('--ahig-seg-i').trim()
  ok(idx === '2', '切换后指示器目标索引 = 2（滑轨跟随，过渡中实测值不变是正常的）', idx)
  {
    const want = btns()[2].getBoundingClientRect().left - list.getBoundingClientRect().left - inset0
    ok(Math.abs(railX() - want) <= 1, '滑轨跟到第 3 个按钮', railX() + ' vs ' + want)
  }

  btns()[0].click()
  api.tabs()

  // 同名标签：两个「上下文」各自带序号（HIG：同级选项要可区分）
  const ctxs = btns().filter((b) => (b.textContent || '').replace(/\s+/g, '') === '上下文')
  ok(ctxs.length === 2, '夹具里有两个同名「上下文」', String(ctxs.length))
  ok(ctxs.every((b, i) => b.getAttribute('data-ahig-dup') === String(i + 1)), '同名标签带序号标记', ctxs.map((b) => b.getAttribute('data-ahig-dup')).join('/'))
  ok(ctxs[1].getAttribute('title') && ctxs[1].getAttribute('title').indexOf('billion-context') > 0, '第二个上下文注明来源', ctxs[1].getAttribute('title'))
  {
    // 轨道下沿到顶栏分隔线的间隙：真机 bug 是 0（轨道紧贴分隔线）
    const hdr = document.querySelector('.hdr')
    const hdrStyle = getComputedStyle(hdr)
    const borderPx = parseFloat(hdrStyle.borderBottomWidth) || 0
    const gap = hdr.getBoundingClientRect().bottom - borderPx - list.getBoundingClientRect().bottom
    ok(gap >= 6, '轨道下沿与顶栏分隔线留出余量（≥6px）', Math.round(gap * 10) / 10 + 'px')
  }
  const trackBox = list.getBoundingClientRect()
  const lastRight = rights[rights.length - 1]
  ok(trackBox.right >= lastRight - 1, '轨道包住最后一个标签', Math.round(trackBox.right) + ' vs ' + lastRight)
  const more = document.getElementById('more').getBoundingClientRect()
  ok(more.left >= trackBox.right - 2, '「更多」按钮不被轨道压住', Math.round(more.left) + ' vs ' + Math.round(trackBox.right))

  // ---- 2) 压到 200px：应当整条退回宿主原样 ----
  document.getElementById('tabsRow').style.width = '200px'
  const narrow = api.tabs()
  ok(narrow.on === false, '装不下时不做改造（退回宿主下划线样式）', String(narrow.on))
  const narrowPad = btns()[0].style.paddingLeft
  ok(narrowPad === '', '退回后没有残留内联样式（含 margin/padding）',
    'padding=' + JSON.stringify(narrowPad) + ' margin=' + JSON.stringify(btns()[0].style.margin))
  const trackRight = list.getBoundingClientRect().right
  const rowRight = document.getElementById('tabsRow').getBoundingClientRect().right
  ok(trackRight <= rowRight + 1, '退回后轨道不溢出所在行', Math.round(trackRight) + ' vs ' + Math.round(rowRight))

  // ---- 3) 恢复宽度：重新画上 ----
  document.getElementById('tabsRow').style.width = '100%'
  const again = api.tabs()
  ok(again.on === true, '恢复宽度后重新画上', String(again.on))

  report()
</script>
</body>
</html>
